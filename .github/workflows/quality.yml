name: Offline quality checks
on:
  pull_request:
  push:
    branches: [main, master]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Python sources
        run: python -m compileall -q .
      - name: Offline planner unit tests
        run: python -m unittest tests.test_offline_planner -v
