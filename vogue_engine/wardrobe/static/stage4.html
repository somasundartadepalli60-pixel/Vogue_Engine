<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vogue Wardrobe Insights</title><style>body{font:16px system-ui;background:#111827;color:#f9fafb;max-width:960px;margin:auto;padding:30px}a{color:#93c5fd}section{background:#1f2937;padding:20px;margin:18px 0;border-radius:12px}button,input,select{padding:10px;margin:4px;border-radius:6px}button{cursor:pointer}table{width:100%;border-collapse:collapse}td,th{padding:8px;text-align:left;border-bottom:1px solid #374151}.error{color:#fca5a5}</style><h1>Wardrobe insights</h1><p><a href="/wardrobe">← Wardrobe</a> · All information is stored locally.</p><section><h2>Log an outfit</h2><label>Outfit <select id="outfits"></select></label><label>Date <input id="day" type="date"></label><label>Note <input id="note" maxlength="500"></label><button id="save">Record wear</button><p id="message" role="status"></p></section><section><h2>Overview</h2><div id="overview"></div></section><section><h2>Wear history</h2><div id="history"></div></section><script>const api='/api/v1/wardrobe';const $=id=>document.getElementById(id);function el(tag,text){const e=document.createElement(tag);e.textContent=String(text);return e}function table(rows,columns){const t=document.createElement('table'),h=document.createElement('tr');columns.forEach(c=>h.append(el('th',c)));t.append(h);rows.forEach(row=>{const tr=document.createElement('tr');row.forEach(v=>tr.append(el('td',v)));t.append(tr)});return t}async function get(path){const r=await fetch(api+path);if(!r.ok)throw Error(await r.text());return r.json()}async function refresh(){try{const [outfits,analytics,history]=await Promise.all([get('/outfits'),get('/analytics'),get('/wear-log')]);$('outfits').replaceChildren(...outfits.map(o=>{const x=el('option',o.name);x.value=o.id;return x}));$('overview').replaceChildren(el('p','Outfit wears logged: '+analytics.logged_outfit_wears),el('h3','Most worn garments'),table(analytics.most_worn.map(x=>[x.name,x.category,x.wears]),['Garment','Category','Wears']),el('h3','Monthly activity'),table(analytics.monthly.map(x=>[x.month,x.wears]),['Month','Outfits']));const box=$('history');box.replaceChildren();history.forEach(x=>{const line=el('p',x.day+' — '+x.outfit_name+' '+x.note+' ');const b=el('button','Undo');b.addEventListener('click',async()=>{await fetch(api+'/wear-log/'+x.id,{method:'DELETE'});await refresh()});line.append(b);box.append(line)});if(!history.length)box.append(el('p','No wear history yet.'))}catch(e){$('message').textContent=e.message;$('message').className='error'}}$('day').value=new Date().toLocaleDateString('en-CA');$('save').addEventListener('click',async()=>{try{const r=await fetch(api+'/wear-log',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({outfit_id:Number($('outfits').value),day:$('day').value,note:$('note').value})});if(!r.ok)throw Error(await r.text());$('message').textContent='Wear recorded';await refresh()}catch(e){$('message').textContent=e.message}});refresh();</script></html>
