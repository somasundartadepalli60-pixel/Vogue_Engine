<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vogue Engine · Outfit Studio</title><style>
:root{font-family:system-ui,sans-serif;color-scheme:dark;background:#111321;color:#f7f4ff}body{max-width:1150px;margin:auto;padding:26px}h1{font-size:2rem}header,p{color:#d6d3e6}.panel,.card{background:#202336;border:1px solid #45445d;border-radius:16px;padding:20px;margin:14px 0}button,input,select{font:inherit;border-radius:8px;padding:10px;border:1px solid #77758b}button{background:#c6adff;color:#171022;cursor:pointer;font-weight:650}button:disabled{opacity:.5;cursor:wait}input,select{background:#151725;color:#fff}label{display:inline-flex;flex-direction:column;gap:5px;margin:5px}#results{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.swatch{width:18px;height:18px;border-radius:50%;border:1px solid #aaa;display:inline-block}.pill{background:#35364b;padding:5px 9px;border-radius:12px}.score{font-size:1.4rem;color:#d8c4ff;font-weight:bold}.error{color:#ffb4bd}.success{color:#b5efce}small{color:#bfbdd0}ul{padding-left:20px}a{color:#dfcfff}</style></head><body>
<header><h1>Outfit Studio</h1><p>Offline outfit recommendations, color harmony, and one-click saving. <a href="/wardrobe/travel">Travel wardrobe</a></p></header>
<section class="panel"><h2>Find combinations</h2><div class="row"><label>Occasion<select id="occasion"><option>casual</option><option>office</option><option>formal</option><option>business</option><option>wedding</option><option>all</option></select></label><label>Season<select id="season"><option>all</option><option>spring</option><option>summer</option><option>autumn</option><option>winter</option></select></label><label>Maximum results<input id="limit" type="number" min="1" max="30" value="10"></label><button id="generate">Recommend outfits</button></div><p id="status" role="status" aria-live="polite"></p></section>
<section class="panel"><h2>Color compatibility</h2><div class="row"><label>First color<input id="first" maxlength="40" value="navy"></label><label>Second color<input id="second" maxlength="40" value="white"></label><button id="compare">Compare colors</button></div><p id="colorResult" role="status" aria-live="polite"></p></section>
<h2>Recommendations</h2><p id="empty">Choose your occasion and select “Recommend outfits”.</p><div id="results"></div>
<script>
'use strict';const $=id=>document.getElementById(id);const base='/api/v1/wardrobe/outfit-engine';let results=[];
function node(tag,text,cls){const el=document.createElement(tag);if(text!==undefined)el.textContent=String(text);if(cls)el.className=cls;return el}
async function request(path,options){const res=await fetch(base+path,options);let data;try{data=await res.json()}catch{throw Error('Server returned an unreadable response')}if(!res.ok)throw Error(typeof data.detail==='string'?data.detail:JSON.stringify(data.detail||data));return data}
function setStatus(message,error=false){$('status').textContent=message;$('status').className=error?'error':'success'}
function render(){const root=$('results');root.replaceChildren();$('empty').textContent=results.length?'':'No matching combinations found. Add a top, bottom and shoes to your wardrobe, or change the filters.';results.forEach((item,i)=>{const card=node('article',undefined,'card');card.append(node('div',`Match score: ${item.score}/100`,'score'));const list=node('ul');item.garments.forEach(g=>{const li=node('li');li.append(node('strong',g.name||`Garment ${g.id}`),node('span',` — ${g.category} · ${g.color||'unknown color'}`));list.append(li)});card.append(list);const breakdown=node('p',`Color ${item.color_score} · Occasion ${item.occasion_score} · Rotation penalty ${item.rotation_penalty}`);card.append(breakdown);const reasons=node('p',item.reasons.join(' • '));card.append(reasons);const input=node('input');input.maxLength=120;input.value=`Outfit ${i+1} (${ $('occasion').value })`;input.setAttribute('aria-label',`Name for recommended outfit ${i+1}`);const save=node('button','Save outfit');save.addEventListener('click',async()=>{if(!input.value.trim()){setStatus('Enter an outfit name.',true);return}save.disabled=true;try{const data=await request('/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:input.value.trim(),garment_ids:item.garment_ids,occasion:$('occasion').value,season:$('season').value})});setStatus(`Saved outfit ${data.name||input.value.trim()} successfully.`)}catch(e){setStatus(e.message,true)}finally{save.disabled=false}});const controls=node('div',undefined,'row');controls.append(input,save);card.append(controls);root.append(card)})}
$('generate').addEventListener('click',async()=>{const btn=$('generate');btn.disabled=true;setStatus('Loading recommendations…');try{const q=new URLSearchParams({occasion:$('occasion').value,season:$('season').value,limit:String(Math.max(1,Math.min(30,Number($('limit').value)||10)))});const data=await request('/recommendations?'+q);results=data.recommendations;render();setStatus(`${results.length} outfit recommendation(s) generated locally.`)}catch(e){results=[];render();setStatus(e.message,true)}finally{btn.disabled=false}});
$('compare').addEventListener('click',async()=>{try{const q=new URLSearchParams({first:$('first').value.trim(),second:$('second').value.trim()});const data=await request('/colors?'+q);$('colorResult').textContent=`Compatibility: ${data.score} — ${data.explanation}`;}catch(e){$('colorResult').textContent=e.message}});
</script></body></html>
