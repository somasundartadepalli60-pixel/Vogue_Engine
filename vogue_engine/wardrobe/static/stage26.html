<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vogue Engine | Inventory Audits</title><style>
:root{font-family:system-ui,sans-serif;color-scheme:light;background:#f5f6fa;color:#1b2430}body{max-width:1100px;margin:30px auto;padding:0 16px}header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}section{background:white;border:1px solid #dce1e8;border-radius:12px;padding:18px;margin:14px 0}button,input,select{font:inherit;padding:9px;border:1px solid #abb6c5;border-radius:7px}button{cursor:pointer;background:#172d52;color:white}button:disabled{opacity:.5;cursor:default}label{display:inline-flex;align-items:center;gap:8px;margin:6px}input[type=checkbox]{width:19px;height:19px}table{border-collapse:collapse;width:100%}td,th{padding:9px;border-bottom:1px solid #e6e9ef;text-align:left} .muted{color:#5b6470}.warn{color:#a33}.ok{color:#17623c}.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.scroll{overflow-x:auto}#message{min-height:1.4em}progress{width:100%;height:18px}
</style></head><body><header><h1>Wardrobe inventory audits</h1><a href="/wardrobe">Wardrobe</a></header><p class="muted">Verify physical garments, find unconfirmed items and compare saved audit snapshots. Everything stays on this device.</p>
<section><h2>Start an audit</h2><form id="create" class="flex"><input id="label" maxlength="120" required placeholder="Audit name, e.g. October inventory"><button>Create snapshot</button></form><p id="message" role="status"></p></section>
<section><h2>Audit checklist</h2><div class="flex"><label>Audit <select id="audit"></select></label><label>Filter <select id="filter"><option value="all">All</option><option value="missing">Unconfirmed</option><option value="confirmed">Confirmed</option></select></label><input id="search" placeholder="Search garment name"></div><p id="summary"></p><progress id="progress" value="0" max="1"></progress><div class="scroll"><table><thead><tr><th>Present</th><th>Garment</th><th>Garment ID</th><th>Inventory status</th></tr></thead><tbody id="items"></tbody></table></div></section>
<section><h2>Compare audits</h2><div class="flex"><label>Earlier <select id="earlier"></select></label><label>Later <select id="later"></select></label><button id="compare">Compare</button></div><div id="comparison"></div></section>
<section><h2>Database integrity</h2><button id="integrity">Run non-destructive check</button><pre id="integrity-result"></pre></section>
<script>
const root='/api/v1/wardrobe/audits';const el=id=>document.getElementById(id);let current=null;let audits=[];
async function api(path='',options={}){const response=await fetch(root+path,options);if(!response.ok){let message='Request failed ('+response.status+')';try{const body=await response.json();message=body.detail||message}catch{}throw Error(message)}return response.json()}
function message(text,error=false){el('message').textContent=text;el('message').className=error?'warn':'ok'}
function option(select,a){const opt=document.createElement('option');opt.value=a.id;opt.textContent=a.label+' (#'+a.id+')';select.append(opt)}
async function refreshAudits(selected){audits=await api();for(const id of ['audit','earlier','later']){const select=el(id),prior=id==='audit'?selected:select.value;select.replaceChildren();audits.forEach(a=>option(select,a));if(audits.some(a=>String(a.id)===String(prior)))select.value=prior}if(audits.length>1&&!el('later').value)el('later').value=audits[0].id;if(audits.length>1&&el('earlier').value===el('later').value)el('earlier').value=audits[1].id;await load()}
async function load(){const id=el('audit').value;if(!id){current=null;render();return}current=await api('/'+id);render()}
function render(){const body=el('items');body.replaceChildren();if(!current){el('summary').textContent='Create an audit to begin.';el('progress').value=0;return}el('summary').textContent=`${current.confirmed} of ${current.total} confirmed; ${current.missing} unconfirmed`;el('progress').max=Math.max(1,current.total);el('progress').value=current.confirmed;const term=el('search').value.toLowerCase(),filter=el('filter').value;for(const item of current.items){if(!item.garment_name.toLowerCase().includes(term))continue;if(filter==='missing'&&item.confirmed)continue;if(filter==='confirmed'&&!item.confirmed)continue;const tr=document.createElement('tr'),check=document.createElement('input');check.type='checkbox';check.checked=Boolean(item.confirmed);check.setAttribute('aria-label','Confirm '+item.garment_name);check.addEventListener('change',async()=>{check.disabled=true;try{current=await api('/'+current.id+'/items/'+item.garment_id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({present:check.checked})});message('Verification saved');render()}catch(e){message(e.message,true);render()}});const td=document.createElement('td');td.append(check);tr.append(td);for(const value of [item.garment_name,String(item.garment_id),item.still_in_wardrobe?'In wardrobe':'Deleted since snapshot']){const cell=document.createElement('td');cell.textContent=value;tr.append(cell)}body.append(tr)}}
function metric(parent,label,value){const p=document.createElement('p');p.textContent=label+': '+value;parent.append(p)}
el('create').addEventListener('submit',async e=>{e.preventDefault();try{const created=await api('',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({label:el('label').value})});el('label').value='';await refreshAudits(created.id);message('Audit created')}catch(err){message(err.message,true)}});
el('audit').addEventListener('change',()=>load().catch(e=>message(e.message,true)));for(const id of ['filter','search'])el(id).addEventListener(id==='search'?'input':'change',render);
el('compare').addEventListener('click',async()=>{const box=el('comparison');box.replaceChildren();if(!el('earlier').value||!el('later').value)return;try{const d=await api('/compare/'+el('earlier').value+'/'+el('later').value);metric(box,'Earlier confirmed',d.earlier_confirmed+'/'+d.earlier_total);metric(box,'Later confirmed',d.later_confirmed+'/'+d.later_total);for(const [key,label] of [['added','Added to snapshot'],['removed','Removed from snapshot'],['newly_confirmed','Newly confirmed'],['no_longer_confirmed','No longer confirmed']]){const h=document.createElement('h3');h.textContent=label+' ('+d[key].length+')';box.append(h);const p=document.createElement('p');p.textContent=d[key].map(x=>x.garment_name+' (#'+x.garment_id+')').join(', ')||'None';box.append(p)}}catch(e){message(e.message,true)}});
el('integrity').addEventListener('click',async()=>{try{const result=await api('/integrity');el('integrity-result').textContent=JSON.stringify(result,null,2)}catch(e){message(e.message,true)}});
refreshAudits().catch(e=>message(e.message,true));
</script></body></html>
