<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vogue Engine · Outfit Feedback</title><style>
:root{font-family:system-ui,sans-serif;color-scheme:dark;background:#101421;color:#f7f5ff}body{max-width:1100px;margin:auto;padding:24px}a{color:#d8c5ff}.panel,.card{background:#20253a;border:1px solid #4a4d65;border-radius:14px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}input,select,textarea,button{font:inherit;padding:9px;border-radius:8px;border:1px solid #8d8aa0}input,select,textarea{background:#131727;color:white}button{background:#d5c0ff;color:#211436;cursor:pointer}button:disabled{opacity:.5}label{display:flex;flex-direction:column;gap:5px;margin:6px 0}textarea{width:95%}.star{font-size:1.4rem}.metric{font-size:1.5rem;font-weight:bold}.muted{color:#c9c6d5}.error{color:#ffb7c2}.success{color:#b3efc9}progress{width:100%}ul{padding-left:22px}</style></head><body>
<header><h1>Outfit Feedback Studio</h1><p>Rate combinations, save favorites, and explore personalized recommendations entirely offline. <a href="/wardrobe/outfit-engine">Outfit Studio</a></p></header>
<section class="panel"><h2>Personalized recommendations</h2><div class="row"><label>Occasion<select id="occasion"><option>casual</option><option>office</option><option>formal</option><option>business</option><option>wedding</option><option>all</option></select></label><label>Season<select id="season"><option>all</option><option>spring</option><option>summer</option><option>autumn</option><option>winter</option></select></label><button id="refresh">Refresh recommendations</button></div><p id="status" role="status" aria-live="polite"></p><div id="recommendations" class="grid"></div></section>
<section class="panel"><h2>Feedback analytics</h2><div id="metrics" class="row"></div><div id="distribution"></div></section>
<section class="panel"><h2>Saved favorites and ratings</h2><label><input id="favoritesOnly" type="checkbox"> Show favorites only</label><div id="saved" class="grid"></div></section>
<script>
'use strict';const $=id=>document.getElementById(id),base='/api/v1/wardrobe/outfit-feedback';let saved=[];
function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=String(text);if(cls)e.className=cls;return e}
async function api(path='',options={}){const r=await fetch(base+path,options);let data;try{data=await r.json()}catch{throw Error('Invalid server response')}if(!r.ok)throw Error(typeof data.detail==='string'?data.detail:JSON.stringify(data.detail||data));return data}
function notice(msg,error=false){$('status').textContent=msg;$('status').className=error?'error':'success'}
function controls(ids,existing,onSaved){const wrap=el('div');const rating=el('select');rating.setAttribute('aria-label','Star rating');for(let n=1;n<=5;n++){const o=el('option',`${n} star${n===1?'':'s'}`);o.value=n;rating.append(o)}rating.value=String(existing?.rating||3);const fav=el('input');fav.type='checkbox';fav.checked=Boolean(existing?.favorite);const favLabel=el('label','Favorite');favLabel.prepend(fav);const notes=el('textarea');notes.maxLength=500;notes.rows=2;notes.placeholder='Optional notes';notes.value=existing?.notes||'';const save=el('button',existing?'Update rating':'Save rating');save.addEventListener('click',async()=>{save.disabled=true;try{await api('',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({garment_ids:ids,rating:Number(rating.value),favorite:fav.checked,notes:notes.value})});notice('Feedback saved.');await reload();if(onSaved)onSaved()}catch(e){notice(e.message,true)}finally{save.disabled=false}});wrap.append(rating,favLabel,notes,save);return wrap}
async function recommendations(){const q=new URLSearchParams({occasion:$('occasion').value,season:$('season').value,limit:'12'});const data=await api('/recommendations?'+q);const root=$('recommendations');root.replaceChildren();if(!data.recommendations.length)root.append(el('p','No matching outfits. Add tops, bottoms and footwear to your wardrobe.'));for(const item of data.recommendations){const card=el('article',undefined,'card');card.append(el('h3',`Score ${item.score}/100`));const ul=el('ul');for(const g of item.garments||[])ul.append(el('li',`${g.name||'Garment '+g.id} · ${g.category||''} · ${g.color||''}`));card.append(ul,el('p',`Base ${item.base_score}; feedback adjustment ${item.feedback_adjustment>=0?'+':''}${item.feedback_adjustment}`),controls(item.garment_ids,saved.find(f=>f.signature===item.garment_ids.slice().sort((a,b)=>a-b).join(',')),null));root.append(card)}}
function renderSaved(){const root=$('saved');root.replaceChildren();const items=saved.filter(f=>!$('favoritesOnly').checked||f.favorite);if(!items.length)root.append(el('p','No saved feedback for this filter.'));for(const f of items){const card=el('article',undefined,'card');card.append(el('h3',`${f.favorite?'★ Favorite · ':''}${f.rating}/5 stars`),el('p',`Garment IDs: ${f.signature}`));const ids=f.signature.split(',').map(Number);card.append(controls(ids,f,null));const del=el('button','Delete feedback');del.addEventListener('click',async()=>{if(!confirm('Delete this outfit feedback?'))return;del.disabled=true;try{const q=new URLSearchParams();ids.forEach(id=>q.append('garment_ids',String(id)));await api('?'+q,{method:'DELETE'});notice('Feedback deleted.');await reload()}catch(e){notice(e.message,true)}finally{del.disabled=false}});card.append(del);root.append(card)}}
async function analytics(){const a=await api('/analytics');const metrics=$('metrics');metrics.replaceChildren();for(const [label,value] of [['Ratings',a.total],['Favorites',a.favorites],['Average rating',a.average_rating??'—']]){const block=el('div',undefined,'card');block.append(el('div',value,'metric'),el('div',label,'muted'));metrics.append(block)}const dist=$('distribution');dist.replaceChildren();for(let n=5;n>=1;n--){const count=a.rating_counts[String(n)]||0;const line=el('div');line.append(el('span',`${n} ★ — ${count}`));const bar=el('progress');bar.max=Math.max(1,a.total);bar.value=count;line.append(bar);dist.append(line)}}
async function reload(){const data=await api();saved=data.feedback;renderSaved();await analytics()}
$('refresh').addEventListener('click',async()=>{try{await reload();await recommendations();notice('Recommendations updated.')}catch(e){notice(e.message,true)}});$('favoritesOnly').addEventListener('change',renderSaved);
(async()=>{try{await reload();await recommendations()}catch(e){notice(e.message,true)}})();
</script></body></html>
