<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vogue Engine · Personal Styling</title><style>body{font:16px system-ui;background:#10151f;color:#e8eaf2;margin:0}main{max-width:950px;margin:40px auto;padding:20px}section{background:#1b2332;padding:22px;border-radius:16px;margin:20px 0}label{display:block;margin:12px 0}input,select,button{padding:10px;border-radius:8px;border:1px solid #64748b;background:#111827;color:white}input{width:min(90%,500px)}button{background:#7055dd;cursor:pointer}li{margin:12px 0}small{color:#b6c2d4}a{color:#b9aaff}</style></head><body><main><h1>Personal Styling Studio</h1><p>Local recommendations · No API keys or cloud accounts</p><p><a href="/wardrobe">Wardrobe</a> · <a href="/wardrobe/insights">Insights</a></p><section><h2>Preferences</h2><p><small>Separate colors/categories with commas.</small></p><label>Preferred colors <input id="preferred_colors" placeholder="navy, white"></label><label>Avoided colors <input id="avoided_colors" placeholder="orange"></label><label>Preferred categories <input id="preferred_categories" placeholder="shirt, jeans"></label><label>Season <select id="season"><option>all</option><option>spring</option><option>summer</option><option>autumn</option><option>winter</option></select></label><label><input type="checkbox" id="prefer_favorites" checked style="width:auto"> Favor favorites</label><label><input type="checkbox" id="prioritize_unworn" checked style="width:auto"> Prioritize unworn garments</label><button id="save">Save preferences</button><p id="status" role="status"></p></section><section><h2>Seasonal coverage</h2><div id="coverage">Loading…</div></section><section><h2>Recommended outfits</h2><button id="refresh">Refresh recommendations</button><ol id="suggestions"></ol></section></main><script>
const fields=['preferred_colors','avoided_colors','preferred_categories'];const $=id=>document.getElementById(id);
async function api(url,options){const r=await fetch(url,options);const data=await r.json();if(!r.ok)throw Error(data.detail||r.statusText);return data}
async function load(){try{const p=await api('/api/v1/wardrobe/preferences');fields.forEach(k=>$(k).value=p[k].join(', '));$('season').value=p.season;$('prefer_favorites').checked=p.prefer_favorites;$('prioritize_unworn').checked=p.prioritize_unworn;await refresh()}catch(e){$('status').textContent=e.message}}
async function refresh(){try{const summary=await api('/api/v1/wardrobe/seasonal-summary');$('coverage').textContent=`${summary.total} garments · ${summary.unworn} unworn · `+Object.entries(summary.by_season).map(([k,v])=>`${k}: ${v}`).join(' · ');const outfits=await api('/api/v1/wardrobe/personalized-suggestions');$('suggestions').replaceChildren();for(const o of outfits){const li=document.createElement('li');li.textContent=o.garments.map(g=>g.name).join(' + ')+` — score ${o.score} (${o.reasons.join('; ')})`;$('suggestions').append(li)}if(!outfits.length)$('suggestions').textContent='Add tops, bottoms, and shoes to see outfit suggestions.'}catch(e){$('status').textContent=e.message}}
$('save').onclick=async()=>{try{const body=Object.fromEntries(fields.map(k=>[k,$(k).value.split(',').map(s=>s.trim()).filter(Boolean)]));body.season=$('season').value;body.prefer_favorites=$('prefer_favorites').checked;body.prioritize_unworn=$('prioritize_unworn').checked;await api('/api/v1/wardrobe/preferences',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});$('status').textContent='Preferences saved locally.';await refresh()}catch(e){$('status').textContent=e.message}};$('refresh').onclick=refresh;load();
</script></body></html>
