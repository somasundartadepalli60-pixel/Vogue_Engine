<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vogue Engine · Wardrobe</title><style>
:root{font-family:system-ui,sans-serif;color:#17212d;background:#f5f7fb}body{max-width:1050px;margin:0 auto;padding:24px}h1{margin-bottom:5px}section{background:white;border:1px solid #dde3ec;border-radius:14px;padding:20px;margin:16px 0}input,select,button{font:inherit;padding:10px;margin:4px;border:1px solid #aeb8c8;border-radius:8px}button{background:#223e71;color:white;cursor:pointer}button:focus,input:focus{outline:3px solid #80b6fa}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.tile{padding:12px;border:1px solid #d7dfe9;border-radius:10px}small{color:#56657a}.error{color:#a01818}#status{min-height:1.5em}label{display:inline-block}a{color:#223e71}</style></head><body>
<h1>Vogue Engine · My Wardrobe</h1><p>Private, local wardrobe dashboard. No API keys, cloud account, or .env file.</p><p id="status" role="status" aria-live="polite"></p>
<section><h2>Add a garment</h2><form id="add"><input name="name" aria-label="Garment name" placeholder="Garment name" required maxlength="120"><select name="category" aria-label="Category"><option value="top">Top</option><option value="bottom">Bottom</option><option value="shoes">Shoes</option><option value="accessories">Accessories</option></select><input name="color" aria-label="Color" placeholder="Color" required><button>Add garment</button></form></section>
<section><h2>Inventory</h2><label>Search <input id="search" placeholder="Name or color"></label><label>Sort <select id="sort"><option value="name">Name</option><option value="newest">Newest</option><option value="most_worn">Most worn</option><option value="least_worn">Least worn</option></select></label><button id="refresh">Refresh</button><div id="inventory" class="grid"></div></section>
<section><h2>Outfit suggestions</h2><button id="suggest">Suggest outfits</button><div id="suggestions" class="grid"></div></section>
<section><h2>Outfit calendar</h2><form id="calendar"><label>Date <input type="date" name="day" required></label><label>Saved outfit <select id="outfit" name="outfit_id" required></select></label><input name="note" aria-label="Note" placeholder="Optional note"><button>Plan outfit</button></form><div id="plans"></div></section>
<section><h2>Backup and restore</h2><button id="backup">Download JSON backup</button><label>Restore JSON <input id="restore" type="file" accept="application/json,.json"></label><p><small>Restore adds garments; it does not replace existing entries.</small></p></section>
<script>
const base='/api/v1/wardrobe';const $=id=>document.getElementById(id);const status=(msg,error=false)=>{$('status').textContent=msg;$('status').className=error?'error':''};
async function request(path,opts){const r=await fetch(base+path,opts);let data=await r.json();if(!r.ok)throw Error(typeof data.detail==='string'?data.detail:'Request failed');return data}
const json=(method,body)=>({method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
function node(tag,text){const e=document.createElement(tag);e.textContent=String(text);return e}
async function refresh(){try{const q=encodeURIComponent($('search').value),sort=encodeURIComponent($('sort').value);const data=await request('/search?q='+q+'&sort='+sort);$('inventory').replaceChildren();for(const g of data.items){const tile=node('div','');tile.className='tile';tile.append(node('strong',g.name),node('p',g.category+' · '+g.color+' · worn '+g.wears+' times'));const wear=node('button','Mark worn');wear.onclick=async()=>{try{await request('/garments/'+g.id,json('PATCH',{wears:g.wears+1}));refresh()}catch(e){status(e.message,true)}};const del=node('button','Delete');del.onclick=async()=>{if(confirm('Delete '+g.name+'?')){await request('/garments/'+g.id,{method:'DELETE'});refresh()}};tile.append(wear,del);$('inventory').append(tile)}status(data.total+' garments found')}catch(e){status(e.message,true)}}
$('add').onsubmit=async e=>{e.preventDefault();try{await request('/garments',json('POST',Object.fromEntries(new FormData(e.target))));e.target.reset();refresh()}catch(err){status(err.message,true)}};
$('refresh').onclick=refresh;$('search').oninput=refresh;$('sort').onchange=refresh;
$('suggest').onclick=async()=>{try{const items=await request('/suggestions');$('suggestions').replaceChildren();for(const x of items){const tile=node('div','');tile.className='tile';tile.append(node('strong','Score: '+x.score),node('p',x.garments.map(g=>g.name).join(' + ')));$('suggestions').append(tile)}if(!items.length)status('Add a top, bottom and shoes to get suggestions')}catch(e){status(e.message,true)}};
async function loadPlans(){try{const outfits=await request('/outfits');$('outfit').replaceChildren();for(const o of outfits){const opt=node('option',o.name);opt.value=o.id;$('outfit').append(opt)}const plans=await request('/calendar');$('plans').replaceChildren(...plans.map(p=>node('p',p.day+' — '+p.outfit_name+' '+p.note)))}catch(e){status(e.message,true)}}
$('calendar').onsubmit=async e=>{e.preventDefault();try{const d=Object.fromEntries(new FormData(e.target));d.outfit_id=Number(d.outfit_id);await request('/calendar',json('PUT',d));loadPlans();status('Outfit scheduled')}catch(err){status(err.message,true)}};
$('backup').onclick=async()=>{try{const data=await request('/export/json');const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='vogue-wardrobe.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){status(e.message,true)}};
$('restore').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());const result=await request('/import/json',json('POST',data));status(result.imported+' garments imported');refresh()}catch(err){status(err.message,true)}};
refresh();loadPlans();
</script></body></html>
