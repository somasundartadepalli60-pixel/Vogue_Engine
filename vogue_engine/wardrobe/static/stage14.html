<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vogue Engine · Photo Gallery</title><style>body{font:16px system-ui;margin:2rem auto;max-width:1050px;padding:0 1rem;background:#f8f8fc;color:#20202a}header{display:flex;justify-content:space-between;align-items:center}form{display:flex;gap:.6rem;flex-wrap:wrap;padding:1rem;background:white;border-radius:12px}input,button,select{padding:.6rem;border:1px solid #ccc;border-radius:8px}button{cursor:pointer;background:#34315f;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1rem;margin-top:1rem}.card{background:white;padding:.8rem;border-radius:12px;box-shadow:0 2px 10px #0001}.card img{width:100%;height:180px;object-fit:cover;border-radius:8px}.card button{margin-top:.5rem}#status{min-height:1.5rem}</style></head><body><header><h1>Wardrobe photo gallery</h1><a href="/wardrobe">Wardrobe</a></header><p>All photos remain on this computer. JPEG, PNG or WebP, up to 8 MiB.</p><form id="upload"><label>Garment <select id="garment" required></select></label><label>Photo <input type="file" id="photo" accept="image/jpeg,image/png,image/webp" required></label><label>Caption <input id="caption" maxlength="240"></label><button>Upload photo</button></form><p id="status" role="status"></p><section id="gallery" class="grid"></section><script>const api='/api/v1/wardrobe/photos', status=document.querySelector('#status');async function load(){const [garments,photos]=await Promise.all([fetch('/api/v1/wardrobe/garments').then(r=>r.json()),fetch(api).then(r=>r.json())]);const select=document.querySelector('#garment');const selected=select.value;select.replaceChildren();for(const g of garments){const option=document.createElement('option');option.value=g.id;option.textContent=g.name+' (#'+g.id+')';select.append(option)}select.value=selected||select.value;const grid=document.querySelector('#gallery');grid.replaceChildren();for(const p of photos){const card=document.createElement('article');card.className='card';const img=document.createElement('img');img.src=api+'/'+p.id+'/image';img.alt=p.caption||'Garment photo';img.loading='lazy';const title=document.createElement('p');title.textContent='Garment #'+p.garment_id+' — '+(p.caption||'No caption');const edit=document.createElement('button');edit.textContent='Edit caption';edit.onclick=async()=>{const caption=prompt('New caption',p.caption);if(caption===null)return;await fetch(api+'/'+p.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({caption})});load()};const del=document.createElement('button');del.textContent='Delete';del.onclick=async()=>{if(confirm('Delete this photo?')){await fetch(api+'/'+p.id,{method:'DELETE'});load()}};card.append(img,title,edit,del);grid.append(card)}}document.querySelector('#upload').onsubmit=async e=>{e.preventDefault();const data=new FormData();data.append('file',document.querySelector('#photo').files[0]);data.append('caption',document.querySelector('#caption').value);const r=await fetch(api+'/garments/'+document.querySelector('#garment').value,{method:'POST',body:data});status.textContent=r.ok?'Photo saved locally':JSON.stringify(await r.json());if(r.ok){e.target.reset();await load()}};load().catch(e=>status.textContent=e.message)</script></body></html>
