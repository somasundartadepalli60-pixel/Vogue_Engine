<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vogue Engine · Travel Planner</title><style>body{font:16px system-ui;background:#f6f5f2;color:#20232b;margin:auto;max-width:1050px;padding:24px}header{display:flex;justify-content:space-between;align-items:center}section{background:white;border:1px solid #ddd;border-radius:14px;padding:20px;margin:18px 0}input,select,button{padding:10px;margin:5px;border-radius:7px;border:1px solid #aaa}button{cursor:pointer;background:#283c53;color:white}button:disabled{opacity:.5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}.item{padding:10px;border:1px solid #ddd;border-radius:8px}.muted{color:#596274}.error{color:#b00020}progress{width:100%;height:22px}</style></head><body><header><h1>Travel wardrobe</h1><a href="/docs">API documentation</a></header><p>Local-only trip planning, packing checklists and outfit schedules.</p><p id="message" role="status"></p><section><h2>Create a trip</h2><form id="create"><input name="name" placeholder="Trip name" required maxlength="120"><input name="destination" placeholder="Destination" required maxlength="120"><label>Start <input name="start_date" type="date" required></label><label>End <input name="end_date" type="date" required></label><select name="season"><option>all</option><option>summer</option><option>winter</option><option>spring</option><option>autumn</option></select><select name="occasion"><option>casual</option><option>formal</option><option>work</option><option>party</option></select><button>Create trip</button></form></section><section><h2>Your trips</h2><select id="trips" aria-label="Choose trip"></select><button id="removeTrip">Delete selected trip</button><div id="tripSummary"></div></section><section><h2>Packing checklist</h2><p><a id="download" href="#">Download packing CSV</a></p><div id="items" class="grid"></div></section><section><h2>Recommended garments</h2><div id="suggestions" class="grid"></div></section><section><h2>Outfit schedule</h2><form id="outfit"><input name="day" type="date" required><select name="outfit_id" id="outfits" required></select><button>Schedule outfit</button></form><div id="schedule"></div></section><script>
const base='/api/v1/wardrobe/travel';const el=id=>document.getElementById(id);let selected=null;
function msg(t,bad=false){el('message').textContent=t;el('message').className=bad?'error':'muted'}
async function api(path,opts={}){const r=await fetch(base+path,opts);if(!r.ok){let detail=await r.text();try{detail=JSON.parse(detail).detail||detail}catch{}throw Error(detail)}return r.json()}
function node(tag,text){const n=document.createElement(tag);n.textContent=String(text);return n}
function btn(label,fn){const b=node('button',label);b.addEventListener('click',()=>Promise.resolve(fn()).catch(e=>msg(e.message,true)));return b}
async function loadTrips(choose){const trips=await api('/trips');el('trips').replaceChildren();for(const t of trips){const o=node('option',`${t.name} — ${t.destination} (${t.start_date})`);o.value=t.id;el('trips').append(o)}selected=choose&&trips.some(t=>t.id===choose)?choose:trips[0]?.id||null;el('trips').value=selected||'';await loadDetails()}
async function loadDetails(){for(const id of ['tripSummary','items','suggestions','schedule'])el(id).replaceChildren();if(!selected){el('download').removeAttribute('href');return}el('download').href=base+'/trips/'+selected+'/checklist.csv';const [s,c,recs,days]=await Promise.all([api(`/trips/${selected}/summary`),api(`/trips/${selected}/checklist`),api(`/trips/${selected}/recommendations`),api(`/trips/${selected}/outfits`)]);el('tripSummary').append(node('p',`${s.days} days · ${s.packed}/${s.total} packed · ${s.remaining} remaining`));const progress=document.createElement('progress');progress.max=100;progress.value=s.percent_packed;el('tripSummary').append(progress);for(const item of c.items){const card=node('div','');card.className='item';const label=document.createElement('label');const check=document.createElement('input');check.type='checkbox';check.checked=!!item.packed;check.addEventListener('change',async()=>{try{await api(`/trips/${selected}/items/${item.id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({packed:check.checked})});await loadDetails()}catch(e){msg(e.message,true)}});label.append(check,node('span',` ${item.name} (${item.category})`));card.append(label,btn('Remove',async()=>{await api(`/trips/${selected}/items/${item.id}`,{method:'DELETE'});await loadDetails()}));el('items').append(card)}for(const entry of recs){const g=entry.garment;const card=node('div','');card.className='item';card.append(node('p',`${g.name} · ${g.category} · ${g.color}`),btn('Add to packing',async()=>{await api(`/trips/${selected}/items/${g.id}`,{method:'POST'});await loadDetails()}));el('suggestions').append(card)}for(const day of days)el('schedule').append(node('p',`${day.day}: ${day.outfit_name}`))}
el('trips').addEventListener('change',()=>{selected=Number(el('trips').value);loadDetails().catch(e=>msg(e.message,true))});el('create').addEventListener('submit',async e=>{e.preventDefault();try{const data=Object.fromEntries(new FormData(e.target));const trip=await api('/trips',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});e.target.reset();await loadTrips(trip.id);msg('Trip created')}catch(err){msg(err.message,true)}});el('removeTrip').addEventListener('click',async()=>{if(!selected||!confirm('Delete this trip and its packing list?'))return;try{await api('/trips/'+selected,{method:'DELETE'});await loadTrips();msg('Trip deleted')}catch(e){msg(e.message,true)}});async function loadOutfits(){const r=await fetch('/api/v1/wardrobe/outfits');if(!r.ok)return;const data=await r.json();const outfits=Array.isArray(data)?data:data.items||[];for(const o of outfits){const option=node('option',o.name);option.value=o.id;el('outfits').append(option)}}el('outfit').addEventListener('submit',async e=>{e.preventDefault();if(!selected)return;try{const data=Object.fromEntries(new FormData(e.target));data.outfit_id=Number(data.outfit_id);await api(`/trips/${selected}/outfits`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});await loadDetails();msg('Outfit scheduled')}catch(err){msg(err.message,true)}});loadTrips().catch(e=>msg(e.message,true));loadOutfits().catch(()=>{});
</script></body></html>
