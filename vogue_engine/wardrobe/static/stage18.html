<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vogue Engine | Photo Organizer</title><style>body{font:16px system-ui;background:#f5f5fa;color:#222;margin:2rem auto;max-width:1200px;padding:0 1rem}header,.toolbar{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}header{justify-content:space-between}button,input,select{padding:.65rem;border:1px solid #aaa;border-radius:8px}button{background:#35335e;color:white;cursor:pointer}button:disabled{opacity:.5}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:1rem;margin-top:1.5rem}.card{background:white;padding:1rem;border-radius:12px;box-shadow:0 1px 6px #0002}.card img{width:100%;height:170px;object-fit:cover;border-radius:8px}.card p{overflow-wrap:anywhere}.toolbar{background:white;padding:1rem;border-radius:12px}#message{min-height:1.5rem}</style></head><body><header><h1>Photo organizer</h1><nav><a href="/wardrobe/photos">Photo gallery</a> · <a href="/wardrobe">Wardrobe</a></nav></header><p>Organize photos locally. Select images to edit captions or delete; search for visually similar photos.</p><div class="toolbar"><label>Garment <select id="garment"><option value="">All garments</option></select></label><label>Search captions <input id="search" placeholder="Caption keywords"></label><label>Sort <select id="sort"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="garment">Garment ID</option></select></label><button id="selectAll">Select visible</button><button id="clear">Clear selection</button></div><div class="toolbar" style="margin-top:1rem"><span id="count">0 selected</span><input id="newCaption" maxlength="240" placeholder="New caption"><button id="caption">Update selected captions</button><button id="delete">Delete selected</button><label>Similarity threshold <input id="threshold" type="number" min="0" max="1" step="0.05" value="0.7"></label><button id="duplicates">Show duplicate candidates</button><button id="reset">Show all</button></div><p id="message" role="status"></p><section id="grid" class="grid"></section><script>
const API='/api/v1/wardrobe/photos',VIS='/api/v1/wardrobe/visual';let photos=[],selected=new Set(),restricted=null;const el=id=>document.getElementById(id);async function request(url,options){const response=await fetch(url,options);const data=await response.json();if(!response.ok)throw Error(data.detail||'Request failed');return data}function message(text){el('message').textContent=text}function visible(){let rows=photos.filter(p=>(!el('garment').value||String(p.garment_id)===el('garment').value)&&p.caption.toLowerCase().includes(el('search').value.toLowerCase())&&(!restricted||restricted.has(p.id)));const sort=el('sort').value;rows.sort((a,b)=>sort==='old'?a.id-b.id:sort==='garment'?a.garment_id-b.garment_id:b.id-a.id);return rows}function render(){const grid=el('grid');grid.replaceChildren();el('count').textContent=selected.size+' selected';for(const p of visible()){const card=document.createElement('article');card.className='card';const check=document.createElement('input');check.type='checkbox';check.checked=selected.has(p.id);check.setAttribute('aria-label','Select photo '+p.id);check.onchange=()=>{check.checked?selected.add(p.id):selected.delete(p.id);el('count').textContent=selected.size+' selected'};const img=document.createElement('img');img.src=API+'/'+p.id+'/image';img.alt=p.caption||'Clothing photo';img.loading='lazy';const caption=document.createElement('p');caption.textContent='#'+p.id+' · Garment #'+p.garment_id+' · '+(p.caption||'No caption');const similar=document.createElement('button');similar.textContent='Find similar';similar.onclick=async()=>{try{const result=await request(VIS+'/similar/'+p.id+'?limit=100&minimum='+encodeURIComponent(el('threshold').value));restricted=new Set([p.id,...result.results.map(x=>x.photo_id)]);render();message('Showing visual matches for photo #'+p.id)}catch(e){message(e.message)}};card.append(check,img,caption,similar);grid.append(card)}}async function refresh(){photos=await request(API);selected=new Set([...selected].filter(id=>photos.some(p=>p.id===id)));const value=el('garment').value;el('garment').replaceChildren(new Option('All garments',''));for(const id of [...new Set(photos.map(p=>p.garment_id))].sort((a,b)=>a-b))el('garment').add(new Option('Garment #'+id,id));el('garment').value=value;render()}for(const id of ['garment','search','sort'])el(id).addEventListener(id==='search'?'input':'change',render);el('selectAll').onclick=()=>{visible().forEach(p=>selected.add(p.id));render()};el('clear').onclick=()=>{selected.clear();render()};el('reset').onclick=()=>{restricted=null;render();message('Showing all photos')};el('caption').onclick=async()=>{if(!selected.size)return message('Select photos first');try{const r=await request(API+'/bulk/captions',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({photo_ids:[...selected],caption:el('newCaption').value})});await refresh();message('Updated '+r.updated+' photos')}catch(e){message(e.message)}};el('delete').onclick=async()=>{if(!selected.size)return message('Select photos first');if(!confirm('Permanently delete '+selected.size+' photos?'))return;try{const r=await request(API+'/bulk/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({photo_ids:[...selected]})});selected.clear();restricted=null;await refresh();message('Deleted '+r.deleted+' photos')}catch(e){message(e.message)}};el('duplicates').onclick=async()=>{try{const result=await request(VIS+'/duplicates?minimum='+encodeURIComponent(el('threshold').value));restricted=new Set();for(const pair of result.pairs){for(const id of pair.photo_ids)restricted.add(id)}render();message('Found '+result.total_pairs+' duplicate candidate pairs; check API docs for details')}catch(e){message(e.message)}};refresh().catch(e=>message(e.message));
</script></body></html>
