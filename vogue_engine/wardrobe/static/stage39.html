<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vogue Engine · Packing templates</title>
<style>
:root{font:16px system-ui;color:#202b38;background:#f4f6f8}body{max-width:1120px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}section{background:white;border:1px solid #dce2e8;border-radius:14px;padding:20px;margin:16px 0}h1{margin-bottom:5px}label{display:inline-flex;flex-direction:column;gap:5px;margin:8px 12px 8px 0}input,select,button{font:inherit;padding:9px;border-radius:7px;border:1px solid #a9b6c2}button{background:#203c58;color:white;cursor:pointer}button.secondary{background:white;color:#203c58}button.danger{background:#8e2633}button:disabled{opacity:.55}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.card{border:1px solid #dce2e8;border-radius:9px;padding:12px}.muted{color:#536374}.error{color:#a7192d}.pill{display:inline-block;background:#e7eef5;padding:3px 9px;border-radius:16px}ul{padding-left:20px}#status{min-height:1.5em}table{border-collapse:collapse;width:100%}th,td{padding:8px;text-align:left;border-bottom:1px solid #dce2e8}
</style></head><body>
<header><div><h1>Packing templates & trip comparison</h1><p class="muted">Offline travel wardrobe · Stage 39</p></div><nav><a href="/wardrobe/travel">Trip planner</a> · <a href="/docs">API docs</a></nav></header>
<p id="status" role="status" aria-live="polite"></p>
<section><h2>Choose a trip</h2><label>Active trip<select id="trip"></select></label><button id="refresh" class="secondary">Refresh</button><p id="tripInfo" class="muted"></p></section>
<section><h2>Reusable packing templates</h2><form id="saveForm"><label>Template name<input id="templateName" required maxlength="120" placeholder="Weekend essentials"></label><button type="submit">Save current trip as template</button></form><div id="templates" class="grid"></div></section>
<section><h2>Seasonal packing suggestions</h2><p class="muted">Rule-based recommendations, not live weather. Verify destination conditions before travel.</p><button id="suggest">Refresh suggestions</button><div id="suggestions" class="grid"></div></section>
<section><h2>Compare packing lists</h2><label>Compare active trip with<select id="otherTrip"></select></label><button id="compare">Compare trips</button><div id="comparison"></div></section>
<script>
'use strict';
const root='/api/v1/wardrobe/travel', $=id=>document.getElementById(id);
let current=null, trips=[];
function message(value,error=false){$('status').textContent=value;$('status').className=error?'error':'muted'}
function textNode(tag,value){const n=document.createElement(tag);n.textContent=String(value);return n}
function action(label,fn,cls=''){const b=textNode('button',label);b.className=cls;b.type='button';b.addEventListener('click',()=>Promise.resolve().then(fn).catch(e=>message(e.message,true)));return b}
async function request(path,options={}){const response=await fetch(root+path,options);if(!response.ok){let body=await response.text();try{const data=JSON.parse(body);body=typeof data.detail==='string'?data.detail:JSON.stringify(data.detail||data)}catch{}throw Error(body)}return response.json()}
function json(method,body){return {method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}}
function choose(select,options,value){select.replaceChildren();for(const t of options){const opt=textNode('option',`${t.name} — ${t.destination}`);opt.value=t.id;select.append(opt)}if(value!=null)select.value=String(value)}
async function refreshTrips(){trips=await request('/trips');current=trips.some(t=>t.id===current)?current:(trips[0]?.id??null);choose($('trip'),trips,current);choose($('otherTrip'),trips.filter(t=>t.id!==current),null);$('tripInfo').textContent=current==null?'Create a trip in the travel planner first.':`${trips.find(t=>t.id===current).start_date} to ${trips.find(t=>t.id===current).end_date}`;await Promise.all([loadTemplates(),loadSuggestions()]);$('comparison').replaceChildren()}
async function loadTemplates(){const data=await request('/templates');$('templates').replaceChildren();if(!data.length)$('templates').append(textNode('p','No saved templates yet.'));for(const t of data){const card=textNode('div','');card.className='card';card.append(textNode('h3',t.name),textNode('p',`${t.items} garments · Saved ${t.created_at}`));const apply=action('Apply to trip',async()=>{if(current==null)return;const result=await request(`/trips/${current}/templates/${t.id}/apply`,{method:'POST'});message(`Template applied. Trip now has ${result.total} items.`);await loadSuggestions()});apply.disabled=current==null;card.append(apply,' ',action('Delete',async()=>{if(!confirm(`Delete template "${t.name}"?`))return;await request(`/templates/${t.id}`,{method:'DELETE'});message('Template deleted');await loadTemplates()},'danger'));$('templates').append(card)}}
async function loadSuggestions(){const area=$('suggestions');area.replaceChildren();if(current==null)return;const plan=await request(`/trips/${current}/seasonal-plan`);area.append(textNode('p',`${plan.days} days · ${plan.season} · ${plan.weather_source}`));const cards=textNode('div','');cards.className='grid';for(const entry of plan.suggestions){const g=entry.garment,card=textNode('div','');card.className='card';card.append(textNode('h3',g.name),textNode('p',`${g.category} · ${g.color} · Score ${entry.score}`));card.append(action('Add to trip',async()=>{await request(`/trips/${current}/items/${g.id}`,{method:'POST'});message(`${g.name} added to packing list`);await loadSuggestions()}));cards.append(card)}if(!plan.suggestions.length)cards.append(textNode('p','No additional garment suggestions.'));area.append(cards)}
function renderList(parent,title,items){const box=textNode('div','');box.className='card';box.append(textNode('h3',`${title} (${items.length})`));const ul=document.createElement('ul');for(const item of items)ul.append(textNode('li',`${item.name} (${item.category})${item.packed?' · packed':''}`));if(!items.length)ul.append(textNode('li','None'));box.append(ul);parent.append(box)}
async function compare(){if(current==null)return;const other=Number($('otherTrip').value);if(!other||other===current){message('Choose another trip to compare.',true);return}const result=await request(`/trips/${current}/compare/${other}`),target=$('comparison');target.replaceChildren();target.append(textNode('h3',`${result.first.trip.name} vs ${result.second.trip.name}`),textNode('p',`Packed: ${result.first.packed}/${result.first.total} vs ${result.second.packed}/${result.second.total}`));const grid=textNode('div','');grid.className='grid';renderList(grid,'Shared garments',result.shared);renderList(grid,'Only in first trip',result.first_only);renderList(grid,'Only in second trip',result.second_only);target.append(grid)}
$('trip').addEventListener('change',async()=>{current=Number($('trip').value);try{await refreshTrips()}catch(e){message(e.message,true)}});
$('refresh').addEventListener('click',()=>refreshTrips().catch(e=>message(e.message,true)));
$('saveForm').addEventListener('submit',async e=>{e.preventDefault();if(current==null){message('Select a trip first.',true);return}try{await request(`/trips/${current}/templates`,json('POST',{name:$('templateName').value}));$('saveForm').reset();message('Template saved');await loadTemplates()}catch(err){message(err.message,true)}});
$('suggest').addEventListener('click',()=>loadSuggestions().catch(e=>message(e.message,true)));
$('compare').addEventListener('click',()=>compare().catch(e=>message(e.message,true)));
refreshTrips().catch(e=>message(e.message,true));
</script></body></html>
